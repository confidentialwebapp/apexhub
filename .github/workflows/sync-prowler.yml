name: Daily Prowler data sync

# Refreshes the build-time data snapshot from the open-source prowler-cloud/prowler
# repo (Apache-2.0). On change it commits + pushes src/data/*, which the Vercel
# Git integration auto-deploys. If Vercel secrets are present, it also deploys
# directly via the Vercel CLI (useful before native Git integration is enabled).

on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch: {} # allow manual runs from the Actions tab

permissions:
  contents: write

concurrency:
  group: prowler-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sparse-clone Prowler data
        run: |
          rm -rf prowler-src
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/prowler-cloud/prowler.git prowler-src
          cd prowler-src
          git sparse-checkout set prowler/providers prowler/compliance

      - name: Regenerate datasets
        run: PROWLER_SRC=./prowler-src node scripts/ingest.mjs

      - name: Commit & push if data changed
        id: commit
        run: |
          git config user.name "apexhub-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- src/data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes."
          else
            git add src/data
            git commit -m "chore(data): daily Prowler snapshot refresh ($(date -u +%Y-%m-%d))"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Pushed refreshed data."
          fi

      # Optional: only runs if Vercel secrets are configured. If you enable the
      # native Vercel Git integration instead, leave these secrets unset and the
      # push above will trigger the deploy (skip this step).
      - name: Deploy to Vercel (CLI fallback)
        if: ${{ steps.commit.outputs.changed == 'true' && env.VERCEL_TOKEN != '' }}
        run: |
          npm i -g vercel@latest
          vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
          vercel build --prod --token "$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"
